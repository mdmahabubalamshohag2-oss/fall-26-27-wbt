<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
</head>
<body>
  <form method="post">
    <fieldset>
      <legend>Registration form</legend>
      <label for="Name">Name:</label>
      <input type="text" name="name" id="Name" placeholder="Enter your full name" required><br>
      <br>
      <label for="birthDate">Date of birth:</label>
      <input type="date" name="birthDate" id="birthDate" required><br><br>
      <label>Gender:</label>
      <input type="radio" name="gender" value="male" id="male">
      <label for="male">Male</label>
      <input type="radio" name="gender" value="female" id="female">
      <label for="female">Female</label>
      <br><br>
      <label for="phone">Phone number:</label>
      <input type="tel" name="phone" id="phone" placeholder="Enter your phone number" required><br><br>
      <label for="email">Email:</label> 
      <input type="email" name="email" id="email" placeholder="Enter your email" required><br><br>
      <label for="address">Address:</label>
      <textarea name="address" id="address" placeholder="Enter your address" required></textarea><br><br>
      <label for="bloodGrp">Blood group:</label>
      <select name="bloodGrp" id="bloodGrp" required>
        <option value="">Select your blood group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select><br><br>
      <label for="password">Password:</label>
      <input type="password" name="password" id="password" placeholder="Create a password" required><br><br>
      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm your password" required><br><br>
      <button type="submit" name="register">Register</button><br><br>
    </fieldset>
  </form>
</body>
</html>
