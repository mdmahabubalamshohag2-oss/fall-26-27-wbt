<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form method="post">
    <fieldset>
      <legend>Donates Required Information.</legend>
      <h2>Donar Information</h2>
      <table>
        <tr>
          <td>
            <label for="fname">First name*</label>
          </td>
          <td><input type="text" id="fname" required></td>
        </tr>

        <tr>
          <td>
            <label for="lname">Last name*</label>
          </td>
          <td><input type="text" id="lname" required></td>
        </tr>

        <tr>
          <td>
            <label for="company">Company</label>
          </td>
          <td><input type="text" id="company"></td>
        </tr>

        <tr>
          <td>
            <label for="adress1">Address1*</label>
          </td>
          <td><input type="text" id="address1" required></td>
        </tr>

        <tr>
          <td>
            <label for="adress2">Address2</label>
          </td>
          <td><input type="text" id="address2"></td>
        </tr>

        <tr>
          <td>
            <label for="city">City*</label>
          </td>
          <td><input type="text" id="city" required></td>
        </tr>
        
        <tr>
          <td>
            <label for="state">State*</label>
          </td>
          <td><select name="state" id="state"><option>please select any</option>
          <option>New York</option>
          <option>Texas</option>
          <option>Califonia</option>
          <option>other</option>
          </select></td>
        </tr>
         <tr>
          <td>
            <label for="zipcode">Zip Code*</label>
          </td>
          <td><input type="number" id="zipcode" required></td>
        </tr>
         <tr>
          <td>
            <label for="country">Country*</label>
          </td>
          <td><select name="country" id="country"><option>please select any</option>
          <option>USA</option>
          <option>UK</option>
          <option>Bangladesh</option>
          <option>Other</option>
          </select></td>
        </tr>
        <tr>
          <td>
            <label for="phone">Phone</label>
          </td>
          <td><input type="tel" id="phone"></td>
        </tr>
        <tr>
          <td>
            <label for="fax">Fax</label>
          </td>
          <td><input type="text" id="fax"></td>
        </tr>

         <tr>
          <td>
            <label for="email">Email*</label>
          </td>
          <td><input type="email" id="email" required></td>
        </tr>

         <tr>
          <td>
            <label>Donation Ammount*</label>
          </td>
          <td><input type="radio" name="donation" value="none">None<input type="radio" name="donation" value="$50">$50<input type="radio" name="donation" value="$75">$75<input type="radio" name="donation" value="$100">$100<input type="radio" name="donation" value="$250">$250<input type="radio" name="donation" value="other">other</td>
        </tr>
         <tr>
          <td><label>(check a button or type in your<br>ammount)</label></td>
        <td><label for="ammount1">Other Ammount$</label></td>
        <td><input type="text" id="ammount1"></td>
         </tr>
        <tr>
          <td><label>Recurring Donation</label></td>
          <td><input type="checkbox" value="regularity">I am interested in giving on a regular basis.</td>
        </tr>
        <tr>
          <td><label>(check if yes)</label></td>
        </tr>
      </table>
    </fieldset>
  </form>
</body>
</html>
